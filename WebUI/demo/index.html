<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABDScope — Studio Audio Visualizer</title>
  <link rel="stylesheet" href="../src/scope.css">
  <link rel="stylesheet" href="demo.css">
</head>
<body data-theme="ms2000">

  <header class="demo-header">
    <div class="demo-title">
      <span>ABDScope</span>
      <span class="demo-badge">Universal Visualizer Engine</span>
    </div>
    <div class="btn-group">
      <!-- Theme Dropdown in Header -->
      <div style="display: flex; align-items: center; gap: 6px; margin-right: 8px;">
        <span style="font-size: 11px; color: var(--scope-text-muted);">Theme:</span>
        <select id="theme-select" class="demo-btn" style="padding: 4px 8px; cursor: pointer;">
          <option value="ms2000" selected>MS2000 (Cian)</option>
          <option value="cz101">CZ-101 (Red)</option>
          <option value="deepmind">DeepMind (Amber)</option>
          <option value="audiolab">AudioLab (Green)</option>
        </select>
      </div>

      <button class="demo-btn active" id="btn-mount-embedded">Embedded</button>
      <button class="demo-btn" id="btn-mount-floating">Floating Modal</button>
      <button class="demo-btn" id="btn-snapshot">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -1px; margin-right: 4px;">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>Snapshot
      </button>
      <button class="demo-btn" id="btn-toggle-audio">Start Web Audio</button>
    </div>
  </header>

  <main class="demo-layout">
    <!-- Sidebar: Signal Generator & Controls -->
    <aside class="demo-panel">
      <div class="panel-title">Signal Generator</div>

      <div class="control-group">
        <div class="control-label"><span>Waveform</span></div>
        <div class="btn-group" id="waveform-selector">
          <button class="demo-btn active" data-wave="sine">Sine</button>
          <button class="demo-btn" data-wave="sawtooth">Saw</button>
          <button class="demo-btn" data-wave="square">Square</button>
          <button class="demo-btn" data-wave="triangle">Tri</button>
          <button class="demo-btn" data-wave="noise">Noise</button>
        </div>
      </div>

      <div class="control-group">
        <div class="control-label"><span>Frequency</span><span id="val-freq">440 Hz</span></div>
        <input type="range" id="slider-freq" min="20" max="2000" step="1" value="440">
      </div>

      <div class="control-group">
        <div class="control-label"><span>FM Modulation</span><span id="val-fm">0.00</span></div>
        <input type="range" id="slider-fm" min="0" max="1" step="0.01" value="0">
      </div>

      <div class="control-group">
        <div class="control-label"><span>Stereo Phase / Spread</span><span id="val-phase">0° (Mono)</span></div>
        <input type="range" id="slider-phase" min="0" max="180" step="1" value="0">
      </div>

      <div class="control-group">
        <div class="control-label"><span>Gain</span><span id="val-gain">0.50</span></div>
        <input type="range" id="slider-gain" min="0" max="1" step="0.01" value="0.5">
      </div>

      <div class="panel-title" style="margin-top: 10px;">Input Source</div>
      <div class="btn-group">
        <button class="demo-btn active" id="btn-src-webaudio">Web Audio API</button>
        <button class="demo-btn" id="btn-src-bridge">Simulated C++ Bridge</button>
        <button class="demo-btn" id="btn-src-audioin">Audio In</button>
      </div>

      <!-- Spectrogram Settings (Displayed under controls) -->
      <div id="waterfall-controls" style="margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--scope-border, rgba(255,255,255,0.1));">
        <div class="control-label"><span>Waterfall Color Palette</span></div>
        <select id="palette-select" class="demo-btn" style="width: 100%; margin-top: 4px; padding: 5px 8px; cursor: pointer;">
          <option value="inferno" selected>Inferno (Studio Heat)</option>
          <option value="viridis">Viridis (Perceptual)</option>
          <option value="crt">CRT Green (Retro)</option>
          <option value="cyberpunk">Cyberpunk (Neon)</option>
        </select>
      </div>
    </aside>

    <!-- Visualizer Viewport -->
    <section class="demo-panel demo-scope-viewport" id="scope-container"></section>
  </main>

  <script type="module">
    import { createScope } from '../src/scope.js';
    import { OscilloscopeRenderer } from '../src/renderers/OscilloscopeRenderer.js';
    import { SpectrumRenderer } from '../src/renderers/SpectrumRenderer.js';
    import { LissajousRenderer } from '../src/renderers/LissajousRenderer.js';
    import { PhaseMeterRenderer } from '../src/renderers/PhaseMeterRenderer.js';
    import { SpectrogramRenderer } from '../src/renderers/SpectrogramRenderer.js';
    import { TestSignalGenerator } from './test-signals.js';

    const sigGen = new TestSignalGenerator();
    let currentScope = null;
    let currentMountMode = 'embedded';
    let bridgeSimInterval = null;
    let specRendererInstance = null;

    function initScope(mountMode = 'embedded') {
      if (currentScope) {
        currentScope.destroy();
        currentScope = null;
      }

      currentMountMode = mountMode;
      const container = document.getElementById('scope-container');
      if (container && mountMode === 'embedded') {
        container.innerHTML = '';
      }

      currentScope = createScope({
        containerId: 'scope-container',
        mountMode,
        title: 'ABDScope Telemetry',
        enabledModes: ['oscilloscope', 'spectrum', 'lissajous', 'phase', 'spectrogram'],
        defaultMode: 'oscilloscope',
        showFreeze: true,
        showVuMeters: true,
        onClose: () => {
          document.getElementById('btn-mount-floating').classList.remove('active');
          document.getElementById('btn-mount-embedded').classList.add('active');
          initScope('embedded');
          startActiveSource();
        }
      });

      specRendererInstance = new SpectrogramRenderer();
      const palSelect = document.getElementById('palette-select');
      if (palSelect) specRendererInstance.palette = palSelect.value;

      currentScope.registerRenderer('oscilloscope', new OscilloscopeRenderer());
      currentScope.registerRenderer('spectrum', new SpectrumRenderer());
      currentScope.registerRenderer('lissajous', new LissajousRenderer());
      currentScope.registerRenderer('phase', new PhaseMeterRenderer());
      currentScope.registerRenderer('spectrogram', specRendererInstance);

      if (mountMode === 'floating') {
        currentScope.open();
      }
    }

    initScope('embedded');

    function startBridgeSim() {
      if (bridgeSimInterval) clearInterval(bridgeSimInterval);
      let t = 0;
      bridgeSimInterval = setInterval(() => {
        t += 33;
        if (currentScope && !currentScope.isDestroyed) {
          const pkt = sigGen.generateSimulatedBridgePacket(t);
          currentScope.pushFrame(pkt);
        }
      }, 33);
    }

    function stopBridgeSim() {
      if (bridgeSimInterval) {
        clearInterval(bridgeSimInterval);
        bridgeSimInterval = null;
      }
    }

    function startActiveSource() {
      if (document.getElementById('btn-src-bridge').classList.contains('active')) {
        startBridgeSim();
      } else if (sigGen.analyserL) {
        currentScope.connectAnalyser({ analyserL: sigGen.analyserL, analyserR: sigGen.analyserR });
      }
    }

    // Audio Init
    const btnAudio = document.getElementById('btn-toggle-audio');
    btnAudio.onclick = async () => {
      stopBridgeSim();
      const analysers = await sigGen.init();
      currentScope.connectAnalyser(analysers);
      btnAudio.textContent = 'Audio Active';
      btnAudio.classList.add('active');
    };

    // Snapshot
    document.getElementById('btn-snapshot').onclick = () => {
      if (currentScope) currentScope.downloadFrame('abd-scope-capture.png');
    };

    // Waveform Buttons
    document.getElementById('waveform-selector').onclick = (e) => {
      const btn = e.target.closest('button');
      if (btn) {
        document.querySelectorAll('#waveform-selector button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        sigGen.setWaveform(btn.dataset.wave);
      }
    };

    // Sliders
    const sFreq = document.getElementById('slider-freq');
    sFreq.oninput = (e) => {
      const hz = parseFloat(e.target.value);
      document.getElementById('val-freq').textContent = `${hz} Hz`;
      sigGen.setFrequency(hz);
    };

    const sFm = document.getElementById('slider-fm');
    sFm.oninput = (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('val-fm').textContent = val.toFixed(2);
      sigGen.setFmAmount(val);
    };

    const sPhase = document.getElementById('slider-phase');
    sPhase.oninput = (e) => {
      const deg = parseFloat(e.target.value);
      let label = `${deg}°`;
      if (deg === 0) label += ' (Mono)';
      else if (deg === 90) label += ' (Wide Stereo)';
      else if (deg === 180) label += ' (Anti-Phase)';
      document.getElementById('val-phase').textContent = label;
      sigGen.setStereoPhase(deg);
    };

    const sGain = document.getElementById('slider-gain');
    sGain.oninput = (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('val-gain').textContent = val.toFixed(2);
      sigGen.setLevel(val);
    };

    // Mount Mode Toggle
    const btnEmbedded = document.getElementById('btn-mount-embedded');
    const btnFloating = document.getElementById('btn-mount-floating');

    btnEmbedded.onclick = () => {
      if (currentMountMode !== 'embedded') {
        btnEmbedded.classList.add('active');
        btnFloating.classList.remove('active');
        initScope('embedded');
        startActiveSource();
      }
    };

    btnFloating.onclick = () => {
      if (currentMountMode === 'floating') {
        btnFloating.classList.remove('active');
        btnEmbedded.classList.add('active');
        initScope('embedded');
      } else {
        btnFloating.classList.add('active');
        btnEmbedded.classList.remove('active');
        initScope('floating');
      }
      startActiveSource();
    };

    // Theme Switcher in Header
    document.getElementById('theme-select').onchange = (e) => {
      document.body.setAttribute('data-theme', e.target.value);
    };

    // Spectrogram Palette Selector (Live update without resetting tab)
    document.getElementById('palette-select').onchange = (e) => {
      if (specRendererInstance) {
        specRendererInstance.palette = e.target.value;
      }
    };

    // Source Modes
    const btnSrcBridge = document.getElementById('btn-src-bridge');
    const btnSrcWebAudio = document.getElementById('btn-src-webaudio');
    const btnSrcAudioIn = document.getElementById('btn-src-audioin');

    btnSrcBridge.onclick = () => {
      btnSrcBridge.classList.add('active');
      btnSrcWebAudio.classList.remove('active');
      btnSrcAudioIn.classList.remove('active');
      startBridgeSim();
    };

    btnSrcWebAudio.onclick = async () => {
      btnSrcWebAudio.classList.add('active');
      btnSrcBridge.classList.remove('active');
      btnSrcAudioIn.classList.remove('active');
      stopBridgeSim();
      const analysers = await sigGen.init();
      currentScope.connectAnalyser(analysers);
    };

    btnSrcAudioIn.onclick = async () => {
      btnSrcAudioIn.classList.add('active');
      btnSrcBridge.classList.remove('active');
      btnSrcWebAudio.classList.remove('active');
      stopBridgeSim();
      await sigGen.init();
      await sigGen.startMic();
      currentScope.connectAnalyser({ analyserL: sigGen.analyserL, analyserR: sigGen.analyserR });
    };
  </script>
</body>
</html>
